name: Mobile test APK

on:
  push:
    branches: [feat/android-microbot-compat]
    paths:
      - .github/workflows/mobile-test-apk.yml
      - runelite-client/**
      - runelite-api/**
      - android/**
      - scripts/**
      - tools/**
      - ios/app/**
      - gradle*
      - '*.toml'
      - '*.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 ndk;27.0.12077973 cmake;3.22.1
      - name: Contract preflight
        run: ./android/dev-tools/ci/release-gate.sh --contract-only
      - name: Runtime and woodcutting checks
        run: >-
          ./gradlew --no-daemon --max-workers=2 :client:test
          --tests 'net.runelite.client.plugins.microbot.*'
          --tests 'net.runelite.client.plugins.mobilemicrobot.*'
          --tests 'net.runelite.client.headless.JavaBridge*Test'
          --tests net.runelite.client.callback.ClientThreadOptionalTest
          :client:checkstyleMain :client:pmdMain
      - name: Build test APK
        run: bash scripts/build-android.sh "$GITHUB_WORKSPACE" --debug
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
      - name: Verify and prepare download
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q '^application-debuggable'
          python3 -c 'import zipfile; z=zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk"); assert not any(n.endswith("tokens.json") for n in z.namelist())'
          mkdir -p download
          cp "$apk" download/runemobile-mobile-debug-arm64.apk
          git rev-parse HEAD > download/SOURCE_COMMIT.txt
          (cd download && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runemobile-mobile-debug-arm64
          path: download/
          if-no-files-found: error
          retention-days: 14
